# First green run: run 1 on 2026-11-04 (5 jobs). Jobs added since are noted in
# docs/development/PHASE_1_COMPLETION_REPORT.md ("Follow-up").
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      ARTIFY_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # the breaking-change check compares against an earlier commit
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project services/api --frozen
      - run: uv run --project services/api ruff check services/api
      - run: uv run --project services/api ruff format --check services/api
      - run: cd services/api && uv run mypy src
      - run: cd services/api && uv run lint-imports
      - run: uv run --project services/api python services/api/scripts/export_openapi.py --check
      - name: OpenAPI breaking-change check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="origin/${{ github.base_ref }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "no base commit to compare"; exit 0; fi
          uv run --project services/api python services/api/scripts/check_openapi_breaking.py "git:$BASE" packages/api-client/openapi.json --allow packages/api-client/breaking-changes-allowed.txt
      - run: uv run --project services/api pytest services/api/tests -rs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @artify/api-client generate && git diff --exit-code packages/api-client/src/schema.d.ts
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @artify/web lint
      - run: pnpm --filter @artify/web test
      - run: pnpm --filter @artify/web build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: uv sync --project services/api --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @artify/web exec playwright install --with-deps chromium
      - run: infrastructure/dev/e2e.sh

  # Phase 5: Windows desktop. `desktop` runs everything that can run on Linux (Rust core tests, UI tests, a compile check
  # of the Tauri shell and the core against a REAL API). `desktop-windows` builds the installer; it is NOT yet a
  # verified gate (see docs/desktop/WINDOWS_BUILD_AND_INSTALLATION.md) and its output is unsigned.
  desktop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libsecret-1-dev
      - run: uv sync --project services/api --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @artify/desktop lint
      - run: pnpm --filter @artify/desktop typecheck
      - run: pnpm --filter @artify/desktop test
      - run: pnpm --filter @artify/desktop build
      - run: cd apps/desktop && cargo fmt --all --check
      - run: cd apps/desktop && cargo clippy -p artify-core --all-targets --locked -- -D warnings
      - run: cd apps/desktop && cargo test -p artify-core --locked
      - run: cd apps/desktop && cargo check -p artify-desktop --locked
      - name: Rust core against a real API
        run: infrastructure/dev/desktop_live.sh

  desktop-windows:
    runs-on: windows-latest
    continue-on-error: true      # unverified until a first successful run is recorded
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop }
      - run: pnpm install --frozen-lockfile
      - run: cd apps/desktop && cargo test -p artify-core --locked
      - run: cd apps/desktop && pnpm tauri build --bundles nsis
        env:
          ARTIFY_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: artify-desktop-unsigned-installer
          path: apps/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - run: uv export --project services/api --no-hashes --no-emit-project | grep -v '^#' > /tmp/req.txt
      - run: uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip
      - run: pnpm audit --prod
      - name: JavaScript dev dependencies (fail on high/critical; known moderate minimatch advisories are tolerated)
        run: pnpm audit --audit-level high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project services/api --frozen
      - run: docker compose build
      - run: docker compose up -d --no-build
      - run: sleep 15 && docker compose ps -a
      - run: uv run --project services/api python infrastructure/dev/compose_smoke.py
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_docs.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
