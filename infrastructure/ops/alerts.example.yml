# Example Prometheus alert rules for Artify Co-Accountant. A STARTING POINT, not a tested production configuration: no scraper
# or alert manager has been run against these. Thresholds are guesses to be tuned on staging. The metrics come from
# GET /api/v1/metrics (enable with ARTIFY_METRICS_TOKEN; scrape with `Authorization: Bearer <token>`).
groups:
  - name: artify
    rules:
      - alert: ArtifyApiDown
        expr: up{job="artify-api"} == 0
        for: 2m
        labels: {severity: critical}
      - alert: ArtifyDatabaseUnreachable
        expr: artify_database_up == 0
        for: 1m
        labels: {severity: critical}
      - alert: ArtifyServerErrors
        expr: increase(artify_http_responses_total{class="5xx"}[5m]) > 10
        for: 5m
        labels: {severity: warning}
      - alert: ArtifyOutboxStuck          # the dispatcher is not running, or the worker is failing
        expr: artify_outbox_oldest_pending_seconds > 300
        for: 5m
        labels: {severity: warning}
      - alert: ArtifyOutboxFailures
        expr: artify_outbox_events{state="failed"} > 0
        for: 10m
        labels: {severity: warning}
      - alert: ArtifyAuditSealerBehind    # the audit-sealer job is not running: recent audit history is not yet tamper-evident
        expr: artify_audit_oldest_unsealed_seconds > 900
        for: 10m
        labels: {severity: warning}
      - alert: ArtifyDatabaseSlow
        expr: artify_database_ping_milliseconds > 200
        for: 10m
        labels: {severity: warning}
