# Local infrastructure for development. NOT VERIFIED in Phase 1: the build environment had no Docker
# daemon, so this file has been written but never started. Use `make db-reset` after `docker compose up -d`
# (set PGHOST=localhost PGPORT=5432 PGPASSWORD=postgres).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres        # development only
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:                                  # S3-compatible object storage (used from Phase 6)
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin         # development only
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
volumes:
  pgdata:
  miniodata:
