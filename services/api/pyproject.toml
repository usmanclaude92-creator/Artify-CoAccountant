[project]
name = "artify-api"
version = "0.1.0"
description = "Artify Co-Accountant shared cloud backend (Phase 1 foundation)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic[email]==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "pyotp==2.10.0",
  "cryptography==50.0.2",
  "redis==8.1.0",
  "celery[redis]==5.6.3",
  "packaging>=24.2",
  "uuid-utils==1.2.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "aiosmtpd==1.4.6",
  "import-linter==2.15",
]

[project.scripts]
artify-api = "artify_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artify_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:artify_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# Module boundaries (ADR-004: modular monolith). Run with `lint-imports` from this directory.
[tool.importlinter]
root_package = "artify_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: routes depend on services, never the reverse"
type = "layers"
layers = [
  "artify_api.main | artify_api.cli",
  "artify_api.routers",
  "artify_api.idempotency | artify_api.auth_provider | artify_api.seed",
  "artify_api.context | artify_api.auth_service",
  "artify_api.entitlements | artify_api.outbox | artify_api.audit | artify_api.policy | artify_api.mailer | artify_api.ratelimit | artify_api.worker",
  "artify_api.db | artify_api.security",
  "artify_api.errors | artify_api.ids | artify_api.auth_types | artify_api.permissions | artify_api.logging_config | artify_api.settings",
]

[[tool.importlinter.contracts]]
name = "Authorization policy and permission catalog stay pure (no web framework, no database)"
type = "forbidden"
source_modules = ["artify_api.policy", "artify_api.permissions"]
forbidden_modules = ["sqlalchemy", "fastapi", "artify_api.db"]
